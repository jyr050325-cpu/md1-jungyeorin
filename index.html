<!doctype html>
<!-- 도구: Claude(Anthropic)와 대화하며 바이브 코딩(HTML·CSS·Canvas 2D), 콘셉트·스케치·피드백은 직접 / 출처: 레퍼런스 — Nicholas Rougeux 「Weather Portraits」(개별 홀씨 형태), 핀터레스트 방사형 데이터 시각화·네트워크 그래프 이미지(다발 구조), 키치 파스텔 인포그래픽 포스터(색) · 폰트 Google Fonts(Space Grotesk, IBM Plex Sans KR, Gowun Batang, IBM Plex Mono, EB Garamond) · 문장 데이터는 예시로 직접 작성 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WHOOOO-!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@1&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+KR:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────
   WHOOOO-!  · 미디어디자인Ⅰ 9주차 — 토큰 / 모듈 / 패턴
   레이아웃: 한 화면. 다발(모듈 L)은 12칸 그리드의 5|6칸 사이 세로선 위, 화면 높이 절반에 중심.
             보내는 꽃 = 흰 바탕, 받는 꽃 = 검은 바탕 (같은 구도, 빛만 반전). 스크롤 ↑ = 밭(패턴).
   토큰 3층: ① 원시값(primitive) → ② 의미(semantic) → ③ 부품(component).
             캔버스도 아래 토큰을 getComputedStyle로 읽어서 그림 — 토큰을 바꾸면 그림도 바뀜.
   모듈: 홀씨(*) 1개 = 방사형 선 + 끝점(색) + 가운데 번호.
         크기 변형 S(밭) · M(날아가는 홀씨) · L(펼친 홀씨),  상태 변형 날아가는 / 주운 / 지나간.
         다발 = 홀씨 모듈이 구 모양으로 모인 것.
   패턴: 밭 = 다발 모듈을 반복 배치. 규칙 — 크기 = 문장 수, 점묘/빈 고리 = 상태, 색 = 지금 날고 있는 문장만.
   그리드: 12/8/4칸 · 거터 24/24/16 · 마진 48/32/16 · 최대 1200 (G 키로 보기)
   ───────────────────────────────────────────────────────────── */
:root {
  /* ① 원시값 */
  --p-white: #ffffff; --p-black: #000000;
  --p-gray-950: #111111; --p-gray-600: #6f6f6f; --p-gray-400: #9b9b9b; --p-gray-200: #e4e4e4; --p-gray-850: #262626; --p-gray-50: #f3f3f3;
  --p-cyan: #22d3f0; --p-mint: #27e3a0; --p-lemon: #e6ee2c; --p-pink: #ff57c8; --p-violet: #9a6dff;
  --p-font-display: "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
  --p-font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --p-font-seed: "Gowun Batang", "Apple SD Gothic Neo", serif;
  --p-font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --p-font-meta: "EB Garamond", "Gowun Batang", Georgia, serif;
  --p-step--1: 13px; --p-step-0: 16px; --p-step-1: 20px; --p-step-2: 25px; --p-step-3: 31px; --p-step-4: 39px;

  /* ② 의미 */
  --bg: var(--p-white); --fg: var(--p-gray-950); --fg-sub: var(--p-gray-400); --line: var(--p-gray-200);
  --time-dawn: var(--p-cyan); --time-morn: var(--p-mint); --time-noon: var(--p-lemon); --time-eve: var(--p-pink); --time-night: var(--p-violet);
  --guide: rgba(255, 87, 200, .08); --scrim: rgba(0, 0, 0, .28); --card: var(--p-white);
  --glow: 0;

  /* ③ 부품 (숫자만 = 캔버스가 읽는 값) */
  --title-size: var(--p-step-4);
  --bundle-size: .29;      /* 화면 높이 대비 다발 반지름 */
  --bundle-text: 9.5;     /* 앞쪽 갓털 글자 px */
  --bundle-count: 150;     /* 갓털(선) 수 */
  --bundle-line: .5;
  --stem-line: .7;
  --mix-dawn: 3; --mix-morn: 1.4; --mix-noon: .9; --mix-eve: 3; --mix-night: 1.4;   /* 색 비중: 시안 · 민트 · 레몬 · 핑크 · 바이올렛 */
  --seed-s: 7; --seed-m: 34; --seed-l: 84;
  --seed-line: .55;
  --seed-dot: 1.15;         /* 색 점 굵기 배율 */
  --trail-line: 1.6;
  --seed-speed: 1;

  --cols: 12; --gutter: 24px; --margin: 48px;
  --side: max(var(--margin), calc((100vw - 1200px) / 2));
  color-scheme: light;
}
html[data-mode="recv"] {
  --bg: var(--p-black); --fg: var(--p-gray-50); --fg-sub: var(--p-gray-600); --line: var(--p-gray-850);
  --scrim: rgba(0, 0, 0, .6); --card: #111111; --glow: 1;
  color-scheme: dark;
}
@media (max-width: 1023px) { :root { --cols: 8; --margin: 32px; } }
@media (max-width: 639px) { :root { --cols: 4; --gutter: 16px; --margin: 16px; --title-size: var(--p-step-3); } }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--p-font-ui); word-break: keep-all; transition: background .6s, color .6s; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.grid { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); column-gap: var(--gutter);
  padding-left: max(var(--side), env(safe-area-inset-left, 0px)); padding-right: max(var(--side), env(safe-area-inset-right, 0px)); }
.halo { text-shadow: 0 0 6px var(--bg), 0 0 12px var(--bg); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--time-eve); outline-offset: 2px; }

/* 머리 */
header { position: fixed; left: 0; right: 0; top: 0; z-index: 10; pointer-events: none; padding-top: max(26px, env(safe-area-inset-top, 0px)); align-items: start; row-gap: 12px; }
.title { grid-column: 1 / span 6; margin: 0; font-size: var(--title-size); line-height: 1; height: 1em; }
.title svg { height: .74em; width: auto; overflow: visible; display: block; margin-top: .1em; }
.title .tl { font-family: var(--p-font-display); font-weight: 400; fill: var(--fg); }
.title #titleEnd { transition: opacity .17s; }
.title #titleEnd.flip { opacity: 0; }
.nav { grid-column: -6 / -1; justify-self: end; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; }
.nav button { font-size: var(--p-step--1); padding: 7px 14px; border-radius: 999px; cursor: pointer; background: transparent; color: var(--fg-sub); border: 1px solid var(--line); }
.nav button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.nav .tool { border-style: dashed; }
.nav .help { width: 33px; padding: 7px 0; }
.lede { grid-column: 1 / span 5; margin: 0; font-size: var(--p-step--1); line-height: 1.6; color: var(--fg-sub); }
.zoomhint { grid-column: -4 / -1; justify-self: end; font-family: var(--p-font-num); font-size: 11px; color: var(--fg-sub); pointer-events: auto; background: none; border: 0; cursor: pointer; padding: 0; }
@media (max-width: 1023px) { .title { grid-column: 1 / span 4; } .nav { grid-column: 5 / -1; } }
@media (max-width: 639px) { .title { grid-column: 1 / -1; } .nav { grid-column: 1 / -1; justify-self: start; justify-content: flex-start; } .lede { grid-column: 1 / -1; } .zoomhint { grid-column: 1 / -1; justify-self: start; } }

/* 아래: 한 문장 / 숫자 */
.bar { pointer-events: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding-bottom: max(22px, env(safe-area-inset-bottom, 0px)); align-items: end; row-gap: 10px; }
.compose { pointer-events: auto; grid-column: 1 / span 7; display: flex; align-items: center; gap: 14px; }
.compose label { flex: 1; min-width: 0; display: block; }
.compose input { width: 100%; border: 0; border-bottom: 1px solid var(--fg); background: transparent; color: var(--fg); font-family: var(--p-font-seed); font-size: var(--p-step-1); padding: 6px 0 9px; border-radius: 0; }
.compose input::placeholder { color: var(--fg-sub); }
.compose input:focus-visible { outline: none; border-bottom-color: var(--time-eve); }
.gauge { width: 34px; height: 34px; flex: none; }
.count { font-family: var(--p-font-num); font-size: 12px; color: var(--fg-sub); font-variant-numeric: tabular-nums; flex: none; min-width: 52px; }
.blowBtn { flex: none; font-family: var(--p-font-seed); font-size: var(--p-step-0); padding: 8px 22px; border: 1px solid var(--fg); border-radius: 999px; background: transparent; cursor: pointer; }
.blowBtn:disabled { opacity: .35; cursor: default; }
.stats { grid-column: 9 / -1; justify-self: end; font-family: var(--p-font-num); font-size: var(--p-step--1); color: var(--fg-sub); font-variant-numeric: tabular-nums; white-space: nowrap; padding-bottom: 8px; }
.stats b { color: var(--fg); font-weight: 500; margin-left: 4px; }
html[data-mode="recv"] .compose { display: none; }
.recvHint { grid-column: 1 / span 6; font-size: var(--p-step--1); color: var(--fg-sub); padding-bottom: 8px; display: none; }
html[data-mode="recv"] .recvHint { display: block; }
@media (max-width: 1023px) { .compose { grid-column: 1 / -1; } .stats { grid-column: 1 / -1; justify-self: start; order: -1; padding-bottom: 0; } .recvHint { grid-column: 1 / -1; } }

/* 밭에서 커서 */
.tip { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; padding: 8px 11px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 2px; opacity: 0; transition: opacity .15s; }
.tip.on { opacity: 1; }
.tip b { font-family: var(--p-font-seed); font-weight: 400; font-size: var(--p-step--1); }
.tip span { font-family: var(--p-font-num); font-size: 11px; color: var(--fg-sub); }

/* 펼친 홀씨 */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.pop { position: fixed; z-index: 31; left: 50%; top: 50%; width: min(500px, calc(100vw - 32px)); max-height: calc(100% - 32px); overflow-y: auto;
  transform: translate(-50%, -46%) scale(.98); opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s;
  background: var(--card); color: var(--fg); border: 1px solid var(--line); padding: 26px 32px 30px; display: grid; justify-items: center; row-gap: 14px; }
.pop.open { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
.pop canvas { width: 200px; height: 200px; }
.pop h3 { margin: 0; font-family: var(--p-font-seed); font-weight: 400; font-size: var(--p-step-2); line-height: 1.35; text-align: center; text-wrap: balance; }
.pop .sub { font-family: var(--p-font-num); font-size: 12px; color: var(--fg-sub); display: flex; gap: 8px; align-items: center; }
.pop .tdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.pop .tally { letter-spacing: -.1em; color: var(--fg); font-weight: 500; }
.pop dl { margin: 4px 0 0; width: 100%; display: grid; }
.pop dl div { display: grid; grid-template-columns: 7.5em 1fr; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); align-items: baseline; }
.pop dt { font-family: var(--p-font-num); font-size: 12px; color: var(--fg-sub); }
.pop dd { margin: 0; font-family: var(--p-font-meta); font-style: italic; font-size: 15px; }
.pop .lost dt, .pop .lost dd { color: var(--fg-sub); }
.pop .lost dd { font-family: var(--p-font-num); font-style: normal; font-size: 12px; letter-spacing: .06em; }
.pop .note { font-size: var(--p-step--1); color: var(--fg-sub); margin: 4px 0 0; }
.pop .acts { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
.pop .acts button { padding: 12px 8px; border-radius: 999px; border: 1px solid var(--fg); background: transparent; cursor: pointer; font-family: var(--p-font-seed); font-size: var(--p-step-0); }
.pop .acts .primary { background: var(--fg); color: var(--bg); }
.pop .x { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border: 0; background: none; cursor: pointer; }
.pop .x svg { width: 100%; height: 100%; }
.pop .x path { stroke: var(--fg-sub); stroke-width: 1.3; fill: none; stroke-linecap: round; }

.toast { position: fixed; left: 50%; top: 112px; z-index: 40; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; background: var(--fg); color: var(--bg); font-size: var(--p-step--1); padding: 9px 14px; border-radius: 999px; transition: opacity .3s, transform .3s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* 처음 들어올 때: 네 컷 */
.intro { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); transition: opacity .4s; overflow-y: auto; }
.intro.fade { opacity: 0; }
.introBox { display: grid; gap: 30px; justify-items: center; }
.comic { display: grid; grid-template-columns: repeat(4, minmax(0, 190px)); gap: 20px; }
@media (max-width: 639px) { .comic { grid-template-columns: repeat(2, minmax(0, 160px)); gap: 14px; } }
.panel { display: grid; gap: 10px; opacity: 0; transform: translateY(6px); transition: opacity .5s, transform .5s; }
.panel.on { opacity: 1; transform: none; }
.panel svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); }
.panel .ink { fill: none; stroke: var(--fg); stroke-width: .7; stroke-opacity: .75; stroke-linecap: round; }
.panel .faint { stroke-opacity: .35; }
.panel p { margin: 0; font-family: var(--p-font-seed); font-size: var(--p-step--1); line-height: 1.5; text-align: center; }
.panel .n { font-family: var(--p-font-num); font-size: 7px; fill: var(--fg); }
.panel .q { font-family: var(--p-font-display); font-weight: 400; font-size: 18px; fill: var(--fg); }
.panel .crumb { font-family: var(--p-font-meta); font-style: italic; font-size: 8px; fill: var(--fg-sub); }
.closeX { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px; border: 0; background: none; cursor: pointer; }
.closeX path { fill: none; stroke: var(--fg); stroke-width: 1.3; stroke-linecap: round; }
.enter { font-family: var(--p-font-seed); font-size: var(--p-step-0); padding: 11px 26px; border: 1px solid var(--fg); background: transparent; cursor: pointer; border-radius: 999px; }

/* 그리드 보기 */
.guide { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .2s; }
.guide.on { opacity: 1; }
.guide i { background: var(--guide); }

/* 토큰 편집기 (과제 제출본에서만) */
.editor { position: fixed; z-index: 45; top: 0; right: 0; bottom: 0; width: min(340px, 100vw); overflow-y: auto; background: var(--card); color: var(--fg); border-left: 1px solid var(--line);
  padding: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 24px 20px; transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); display: grid; gap: 18px; align-content: start; font-size: var(--p-step--1); }
.editor.open { transform: none; }
.editor h2 { margin: 0; font-family: var(--p-font-display); font-size: var(--p-step-1); display: flex; justify-content: space-between; align-items: center; }
.editor h2 button { font-size: 12px; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.editor section { display: grid; gap: 10px; }
.editor h4 { margin: 0; font-family: var(--p-font-num); font-weight: 500; font-size: 11px; letter-spacing: .06em; color: var(--fg-sub); }
.editor .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.editor .row label { font-size: 13px; }
.editor .row code { font-family: var(--p-font-num); font-size: 10.5px; color: var(--fg-sub); grid-column: 1 / -1; }
.editor .row output { font-family: var(--p-font-num); font-size: 12px; font-variant-numeric: tabular-nums; }
.editor input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--time-eve); }
.editor input[type="color"] { width: 40px; height: 26px; border: 1px solid var(--line); padding: 0; background: none; }
.editor .colors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.editor .colors label { display: grid; gap: 4px; justify-items: center; font-size: 11px; }
.editor .layers { font-family: var(--p-font-num); font-size: 11px; color: var(--fg-sub); line-height: 1.7; margin: 0; }
.editor canvas { width: 100%; height: 150px; border: 1px solid var(--line); }
.editor .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.editor .btns button { padding: 9px; border-radius: 999px; border: 1px solid var(--fg); background: none; cursor: pointer; }
.editor textarea { width: 100%; height: 120px; font-family: var(--p-font-num); font-size: 11px; background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 8px; }
.editor textarea[hidden] { display: none; }
</style>
</head>
<body>

<canvas id="cv" aria-label="민들레 다발과 날아가는 홀씨들. 다발을 누르면 홀씨가 날아가고, 날아오는 홀씨를 누르면 문장이 펼쳐집니다."></canvas>
<div class="guide grid" id="guide" aria-hidden="true"></div>

<header class="grid">
  <h1 class="title" id="title" aria-label="WHOOOO-!"><svg id="wsvg" aria-hidden="true"></svg></h1>
  <nav class="nav" id="nav" aria-label="화면">
    <button type="button" id="tabSend" aria-pressed="true">보내는 꽃</button>
    <button type="button" id="tabRecv" aria-pressed="false">받는 꽃</button>
    <button type="button" class="tool" id="gridBtn" aria-pressed="false">그리드 G</button>
    <button type="button" class="tool" id="tokBtn" aria-pressed="false">토큰 T</button>
    <button type="button" class="help" id="helpBtn" aria-label="처음 안내 다시 보기">?</button>
  </nav>
  <p class="lede halo" id="lede"></p>
  <button type="button" class="zoomhint halo" id="zoomHint">스크롤 ↑ 밭 보기</button>
</header>

<form class="bar grid" id="bar" autocomplete="off">
  <div class="compose">
    <label for="line"><span hidden>오늘의 한 문장</span><input id="line" maxlength="50" placeholder="오늘, 한 문장만." enterkeyhint="send"></label>
    <canvas class="gauge" id="gauge" width="68" height="68" aria-hidden="true"></canvas>
    <span class="count" id="count">0 / 50</span>
    <button class="blowBtn" id="blowBtn" type="submit" disabled>후—</button>
  </div>
  <p class="recvHint" id="recvHint">날아오는 홀씨를 누르면 펼쳐져요</p>
  <div class="stats" id="stats"></div>
</form>

<div class="tip" id="tip" aria-hidden="true"><b>누군가의 꽃</b><span id="tipN"></span></div>
<div class="scrim" id="scrim"></div>
<section class="pop" id="pop" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="popH">
  <button class="x" id="popX" type="button" aria-label="닫기"><svg viewBox="0 0 40 40"><path d="M14 14.5 L26 26"/><path d="M26 14 L14 26.5"/></svg></button>
  <canvas id="popSeed" width="400" height="400" aria-hidden="true"></canvas>
  <h3 id="popH"></h3>
  <div class="sub" id="popSub"></div>
  <dl id="popDl"></dl>
  <p class="note" id="popNote"></p>
  <div class="acts" id="popActs"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<div class="intro" id="intro" role="dialog" aria-modal="true" aria-label="처음 안내">
  <button class="closeX" id="closeX" type="button" aria-label="안내 닫기"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M15 15.5 Q22 22.5 29.5 29"/><path d="M29 15 Q22.5 21.5 15 29.5"/></svg></button>
  <div class="introBox">
    <div class="comic" id="comic"></div>
    <button class="enter" id="enter" type="button">들어가기</button>

  // 제목의 W: 형광 점으로
  // 제목: 글자 하나하나를 정사각형 칸에 맞춰 늘림. W는 형광 점을 고르게 찍어 만듦
  function buildW() {
    const fs = parseFloat(getComputedStyle($('title')).fontSize), cap = fs * .74, gap = cap * .26, svg = $('wsvg'), fsz = cap / .7;
    // 글자의 실제 잉크 폭을 재서, 정해진 칸(정사각형) 폭에 딱 맞게 가로로 늘림 → 동글동글한 정방형 비례

    mc.font = `400 100px ${getComputedStyle(root).getPropertyValue('--p-font-display')}`;
    const capH = mc.measureText('H').actualBoundingBoxAscent || 70, k100 = cap / capH;   // 100px 기준 → cap 높이
    const glyph = (ch, x, w, id) => { const m = mc.measureText(ch), L0 = -m.actualBoundingBoxLeft, inkW = (m.actualBoundingBoxRight + m.actualBoundingBoxLeft) || 50, sx = w / (inkW * k100);

      for (let j = (i ? 1 : 0); j <= n; j++, k++) {

        out += `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${rad.toFixed(2)}" fill="var(--time-${TIMES[k % 5]})"/>`;
      }
    }
    x = cap + gap;
    for (const ch of 'HOOOO') { out += glyph(ch, x, cap); x += cap + gap; }

    svg.setAttribute('viewBox', `0 0 ${x.toFixed(2)} ${cap.toFixed(2)}`); svg.style.width = (x / cap * .74) + 'em';
    svg.innerHTML = out;
  }

    COLORS.forEach(([k]) => $('c' + k).addEventListener('input', ev => { root.style.setProperty(k, ev.target.value); apply(); }));
    $('edClose').onclick = () => toggleEditor(false);
    $('edReset').onclick = () => { [...EDIT.map(e => e.k), ...COLORS.map(c => c[0])].forEach(k => root.style.removeProperty(k)); EDIT.forEach(e => { $('r' + e.k).value = parseFloat(DEFAULTS[e.k]); $('o' + e.k).textContent = parseFloat(DEFAULTS[e.k]); }); COLORS.forEach(([k]) => $('c' + k).value = DEFAULTS[k]); apply(); };
    $('edCopy').onclick = () => {
      const txt = ':root {\n' + [...COLORS.map(c => c[0]), ...EDIT.map(e => e.k)].map(k => `  ${k}: ${getComputedStyle(root).getPropertyValue(k).trim()};`).join('\n') + '\n}';
      const out = $('edOut'); out.value = txt; out.hidden = false;
      const done = () => toast('토큰 CSS를 복사했어요'), fall = () => { out.select(); toast('글자를 선택해 두었어요. 복사해서 쓰세요'); };
      try { navigator.clipboard.writeText(txt).then(done, fall); } catch (e) { fall(); }
    };
    $('tokBtn').onclick = () => toggleEditor();
  }
  function drawModules() {
    const c = $('modC'); if (!c) return; const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, 600, 300); x.setTransform(2, 0, 0, 2, 0, 0);
    x.fillStyle = TOK.bg; x.fillRect(0, 0, 300, 150);
    const rec = (t, id) => ({ id, text: id, t });
    drawSeed(x, 22, 52, TOK.seedS * 1.4, rec('morn', '0101'));
    drawSeed(x, 80, 52, Math.min(30, TOK.seedM * .8), rec('eve', '0412'), { num: true });
    drawSeed(x, 180, 52, 44, rec('dawn', '0398'), { num: true });
    x.font = `10px ${TOK.fNum}`; x.fillStyle = TOK.sub; x.textAlign = 'center';
    x.fillText('S · 밭', 22, 112); x.fillText('M · 날아가는', 80, 112); x.fillText('L · 펼친', 180, 112);
    // 상태
    drawSeed(x, 258, 30, 14, rec('night', '2210'), {}); x.strokeStyle = rgba(TOK.time.night, .4); x.setLineDash([2, 3]); x.beginPath(); x.arc(258, 30, 19, 0, 6.283); x.stroke(); x.setLineDash([]);
    x.globalAlpha = .35; drawSeed(x, 258, 80, 10, rec('noon', '0954'), {}); x.globalAlpha = 1;
    x.fillText('날아오는', 258, 56); x.fillText('지나간', 258, 104);
    x.fillText('같은 모듈 · 크기와 상태만 바뀜', 150, 138);
  }
  if (SHOW_EDITOR) buildEditor(); else { $('tokBtn').remove(); $('editor').remove(); }

  // ───────── 시작 ─────────
  root.dataset.mode = 'send';
  addEventListener('resize', () => { clearTimeout(layout.t); layout.t = setTimeout(refreshAll, 120); });
  readTokens(); layout(); updateUI(); openIntro();
  // 글꼴을 기다리지 않고 바로 그리고, 글꼴이 들어오면 한 번 더 그림
  const safeRefresh = () => { try { refreshAll(); } catch (err) { console.error(err); } };
  safeRefresh(); requestAnimationFrame(frame);
  Promise.all([`16px "Gowun Batang"`, `12px "IBM Plex Mono"`, `italic 12px "EB Garamond"`, `400 16px "Space Grotesk"`, `14px "IBM Plex Sans KR"`].map(f => document.fonts.load(f, '가나A1').catch(() => null))).then(safeRefresh);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(safeRefresh);
})();
</script>
