<title>WHOOOO 저장의 밭</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@200;300;400;500&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@200;300;400&family=Lexend:wght@100..600&family=Manrope:wght@200..600&family=Noto+Sans+KR:wght@200..500&family=Outfit:wght@100..600&family=Sora:wght@100..600&family=Urbanist:wght@100..600&display=swap">
<style>
/* 흰 바탕 한 장. 모서리에 아주 작은 글자들, 가운데 캔버스 하나가 세 스케일을 줌으로 오감 */
:root {
  --bg: #ffffff; --fg: #141417; --sub: rgba(20,20,23,.5); --faint: rgba(20,20,23,.28); --hair: rgba(20,20,23,.12);
  --font: "Sora", "Gothic A1", system-ui, sans-serif;
  --ui: 10.5px; --m: 4.2vw;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 300 var(--ui)/1.6 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.top { position: fixed; z-index: 5; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-top: calc(var(--m) * .8); padding-left: max(var(--m), env(safe-area-inset-left, 0px)); padding-right: max(var(--m), env(safe-area-inset-right, 0px)); pointer-events: none; }
.top > * { pointer-events: auto; }
.ttl { display: flex; align-items: center; user-select: none; color: var(--fg); }
.ed, .key, .card { --bg: #fff; --fg: #141417; --sub: rgba(20,20,23,.5); --faint: rgba(20,20,23,.28); --hair: rgba(20,20,23,.12); color: var(--fg); }
body, .corner button, .pg { transition: none; }
.ttl svg { display: block; overflow: visible; flex: none; }
.ttl .cell { transition: opacity .5s; }
.desc { margin-top: 14px; color: var(--sub); max-width: 230px; min-height: 3.2em; }
.desc b { font-weight: 400; color: var(--fg); }
.tabs { display: flex; gap: 22px; }
.tabs button { font: 300 var(--ui) var(--font); letter-spacing: .28em; background: none; border: 0; padding: 2px 0; color: var(--faint); cursor: pointer; }
.tabs button[aria-pressed="true"] { color: var(--fg); }
button:focus-visible, input:focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
.corner { position: fixed; z-index: 5; left: max(var(--m), env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--m) * .7); display: flex; gap: 6px; align-items: center; }
.corner button, .pg { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--hair); background: var(--bg); color: var(--sub); font: 300 11px/1 var(--font); cursor: pointer; display: grid; place-items: center; padding: 0; }
.corner button:hover, .pg:hover { color: var(--fg); border-color: var(--faint); }
.pg { position: fixed; z-index: 5; transform: translate(-50%, -50%); font-size: 8px; }
.foot { position: fixed; z-index: 5; right: max(var(--m), env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--m) * .7); color: var(--faint); display: flex; gap: 14px; align-items: center; }
.foot button { font: 300 var(--ui) var(--font); background: none; border: 0; color: var(--sub); cursor: pointer; padding: 0; letter-spacing: .04em; }
.foot button:hover { color: var(--fg); }
.tip { position: fixed; z-index: 7; pointer-events: none; color: var(--fg); opacity: 0; transition: opacity .15s; white-space: nowrap; }
.tip.on { opacity: 1; }
.tip small { font-size: inherit; color: var(--faint); margin-left: 6px; }
.scrim { position: fixed; inset: 0; z-index: 8; background: rgba(255,255,255,.4); }
.card { position: fixed; z-index: 9; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(252px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto; background: var(--bg); border: 1px solid var(--hair); padding: 14px; display: grid; gap: 12px; }
.thumb { aspect-ratio: 16 / 10; max-width: 100%; border: 1px dashed var(--hair); display: grid; place-items: center; color: var(--faint); }
.card h2 { margin: 0; font: 300 12.5px/1.5 var(--font); text-wrap: balance; }
.card dl { margin: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 3px 8px; }
.card dt { color: var(--faint); }
.card dd { margin: 0; color: var(--sub); }
.acts { display: flex; gap: 14px; justify-content: flex-end; }
.acts button { font: 300 var(--ui) var(--font); padding: 2px 0; border: 0; border-bottom: 1px solid transparent; background: none; color: var(--sub); cursor: pointer; }
.acts button.go { color: var(--fg); border-color: var(--fg); }
.pick { display: grid; gap: 2px; }
.pick button { display: flex; align-items: center; gap: 8px; text-align: left; font: 300 var(--ui) var(--font); padding: 5px 2px; border: 0; border-bottom: 1px solid var(--hair); background: none; color: var(--fg); cursor: pointer; }
.pick button i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.pick button:hover { color: var(--sub); }
.card label { display: grid; gap: 4px; color: var(--faint); }
.card input { font: 300 12px var(--font); padding: 4px 0; border: 0; border-bottom: 1px solid var(--hair); width: 100%; color: var(--fg); background: none; border-radius: 0; }
.toast { position: fixed; z-index: 10; left: 50%; bottom: calc(var(--m) * .7 + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); color: var(--sub); opacity: 0; transition: opacity .4s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; }
.intro { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; place-items: center; align-content: center; gap: 8vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: opacity .8s; }
.intro svg { width: min(720px, 76vw); max-width: 100%; height: auto; }
.intro svg path { fill: #5c5c63; }
.intro button { font: 300 var(--ui) var(--font); letter-spacing: .5em; padding: 6px 4px 6px 10px; background: none; border: 0; color: var(--sub); cursor: pointer; }
.intro button:hover { color: var(--fg); }
.intro.out { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .intro .pn, .intro button { animation: none; opacity: 1; } }
.intro .pn { opacity: 0; animation: pin 1.1s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(.4s + var(--i) * .8s); }
@keyframes pin { from { opacity: 0; transform: translateY(70px); } to { opacity: 1; transform: none; } }
.intro button { opacity: 0; animation: fin 1s ease forwards 3.9s; }
.intro button svg { display: block; width: auto; height: 12px; }
.intro button circle { fill: rgba(20,20,23,.38); transition: fill .3s; }
.intro button:hover circle { fill: rgba(20,20,23,.85); }
@keyframes fin { to { opacity: 1; } }
.key { position: fixed; z-index: 12; right: max(var(--m), env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--m) * .7 + 26px); width: 236px; max-width: calc(100% - 32px); max-height: calc(100% - 140px); overflow: auto; background: rgba(255,255,255,.94); border: 1px solid var(--hair); padding: 12px 12px 6px; font-size: 9.5px; color: var(--sub); }
.key h3 { margin: 0 0 2px; font: 300 9.5px var(--font); color: var(--fg); letter-spacing: .02em; }
.key section { padding: 6px 0 8px; border-top: 1px solid var(--hair); }
.key section:first-child { border-top: 0; padding-top: 0; }
.key .ks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; text-align: center; line-height: 1.3; }
.key .ks canvas { width: 34px; height: 34px; display: block; margin: 0 auto; }
.key dl { margin: 0; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 1px 6px; }
.key dt { color: var(--fg); }
.key dd { margin: 0; }
.ed select { font: 300 10px var(--font); width: 100%; border: 0; border-bottom: 1px solid var(--hair); background: none; color: var(--fg); padding: 1px 0; }
/* 토큰 에디터 */
.ed { position: fixed; z-index: 15; top: 0; right: 0; bottom: 0; width: 300px; max-width: 100%; background: rgba(255,255,255,.96); border-left: 1px solid var(--hair); overflow: auto; padding-block: 14px 40px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 10px; }
.ed header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; letter-spacing: .2em; }
.ed header div { display: flex; gap: 12px; letter-spacing: 0; }
.ed header button, .ed .row button { font: 300 10px var(--font); background: none; border: 0; color: var(--sub); cursor: pointer; padding: 0; border-bottom: 1px solid var(--hair); }
.ed details { border-top: 1px solid var(--hair); padding: 6px 0; }
.ed summary { cursor: pointer; letter-spacing: .14em; color: var(--fg); padding: 2px 0; }
.ed .row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 40px; gap: 6px; align-items: center; padding: 2px 0; }
.ed .row span { color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed .row output { text-align: right; color: var(--faint); }
.ed .row.chg output { color: var(--fg); }
.ed input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0; background: none; cursor: pointer; }
.ed input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--hair); }
.ed input[type=range]::-moz-range-track { height: 1px; background: var(--hair); }
.ed input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 1px solid #141417; margin-top: -4px; }
.ed input[type=range]::-moz-range-thumb { width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 1px solid #141417; }
.ed .note { color: var(--faint); margin: 2px 0 6px; }
@media (max-width: 700px) {
  :root { --m: 18px; }
  .desc { max-width: 180px; }
  .tabs { gap: 10px; flex-direction: column; align-items: flex-end; }
  .ed { top: auto; height: 55%; width: 100%; border-left: 0; border-top: 1px solid var(--hair); }
}
@media (prefers-reduced-motion: reduce) { .intro, .tip, .toast, .ttl .cell { transition: none; } }
</style>

    inp.oninput = () => { T[k] = +inp.value; out.textContent = fmt(T[k], k); row.classList.toggle('chg', T[k] !== DEF[k]); saveT(); applyTok(k); }; });
  $('edClose').onclick = () => { ed.hidden = true; };
  $('edReset').onclick = () => { T = { ...DEF }; saveT(); applyTok('*'); buildEditor(); };
  $('edData').onclick = () => { D = seedData(); D.landed = []; save(); bGeom = null; place = null; dotCache.clear(); flyers = []; incoming = []; layoutMy(); updateUI(); toast('데이터를 처음으로 돌렸어요'); };
  $('edCopy').onclick = () => { const diff = Object.fromEntries(Object.entries(T).filter(([k, v]) => v !== DEF[k])); const txt = JSON.stringify(diff); try { navigator.clipboard.writeText(txt).then(() => toast('바뀐 값만 복사했어요'), () => toast(txt)); } catch (e) { toast(txt); } };
}
const fmt = (v, k) => k === 'wheelSens' ? (+v).toFixed(4) : k === 'seedStyle' ? 'ABC'[v | 0] : (k === 'titleFont' || k === 'uiFont') ? '' : Math.abs(v) >= 100 ? Math.round(v) : +(+v).toFixed(2);
function applyTok(k) {
  applyCSS(); dotCache.clear(); place = null; disk = null;
  if (k === '*' || /^(clumps|clumpSize|scatter|dust|fDotSize|fAlpha|trails|myR)$/.test(k)) fieldC = null;
  if (k === '*' || /^(title|small|wDot)/.test(k)) setTitle();
  if (k === '*' || k === 'titleFont' || k === 'uiFont') loadFonts();
  if (k === 'dataCount') bGeom = null;
  if (!$('key').hidden) buildKey();
  layoutMy();
}
/* KEY: 화면 안의 작은 범례 — 규칙이 읽혀야 규칙이 의미가 있으니까 */
const keyEl = $('key');
function keyRow(title, items, colFn) {
  const sec = document.createElement('section'); sec.innerHTML = `<h3>${title}</h3>`; const g = document.createElement('div'); g.className = 'ks';
  items.forEach(([s, lab], i) => { const c = document.createElement('canvas'), d = Math.min(2, devicePixelRatio || 1); c.width = c.height = 40 * d; const x = c.getContext('2d'); x.scale(d, d); drawSeed(x, 20, 20, 15, s, colFn ? colFn(i) : GREY(.85)); const cell = document.createElement('div'); cell.append(c); cell.append(lab); g.append(cell); });
  sec.append(g); return sec;
}
function buildKey() {
  const base = { title: 'key', type: '이미지', src: '인스타그램', min: 8 }, c0 = (D.cats.find(c => c.id === 'move') || D.cats[0] || { col: '#FF0099' }).col;
  keyEl.innerHTML = `<section><h3>스케일마다 보이는 것</h3><dl><dt>FIELD</dt><dd>누군가의 밭이 있다는 위치만</dd><dt>MY</dt><dd>카테고리 · 양</dd><dt>다발</dt><dd>출처 · 제목 · 안 본 주</dd><dt>창</dt><dd>전부</dd></dl></section>`;
  keyEl.append(keyRow('털 개수 = 분량', [[1, '~2분'], [5, '~8분'], [15, '~20분'], [40, '20분+']].map(([m, l]) => [{ ...base, min: m }, l])));
  keyEl.append(keyRow('털 끝 = 유형', ['글', '이미지', '영상', '혼합'].map(t => [{ ...base, type: t }, t === '혼합' ? '글+이미지' : t])));
  keyEl.append(keyRow('가운데 = 출처', SRC_LABEL.map(([, l, src]) => [{ ...base, src }, l])));
  keyEl.append(keyRow('홀씨 색 = 카테고리, 안 본 주만큼 검게', [0, 1, 2, 3].map(i => [base, i === 3 ? '3주 → 떠남' : i + '주']), i => seedCol(c0, i / 3)));
  const sec = document.createElement('section'); sec.innerHTML = `<h3>다발 글자 = 안 본 주만큼 투명하게</h3><div class="ks">${[0, 1, 2].map(i => `<div style="color:${txtCol(c0, i)};font-size:10px;padding:6px 0">제목<br><span style="color:var(--faint)">${i}주</span></div>`).join('')}<div style="padding:6px 0">3주<br><span style="color:var(--faint)">떠남</span></div></div>`;
  keyEl.append(sec);
}
$('keyBtn').onclick = () => { const open = keyEl.hidden; if (open) buildKey(); keyEl.hidden = !open; $('keyBtn').setAttribute('aria-expanded', open); };

$('edBtn').onclick = () => { if (ed.hidden) { buildEditor(); ed.hidden = false; } else ed.hidden = true; };

applyCSS(); resize(); updateUI();
loadFonts();
requestAnimationFrame(frame);
})();
</script>
